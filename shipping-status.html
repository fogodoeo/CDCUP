<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>배송 등록 조회 | CDCUP</title>
    <script src="supabase-bridge.js?v=20260702-shipping-status"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
    <style>
        :root { --bg:#f4f7fb; --card:#fff; --line:#e3e9f1; --text:#172033; --muted:#6b7280; --blue:#2563eb; --green:#15803d; --orange:#c2410c; --red:#b91c1c; --shadow:0 10px 30px rgba(23,32,51,.07); font-family:'Pretendard Variable','Pretendard',sans-serif; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f8fafc,#eef3f8); color:var(--text); }
        button,select,input,a { font:inherit; }
        .app { width:min(100%,1040px); margin:0 auto; padding:18px 18px 60px; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
        .back { display:inline-flex; align-items:center; gap:5px; color:#475569; font-size:13px; font-weight:750; text-decoration:none; }
        .refresh { padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:#475569; font-size:11px; font-weight:750; cursor:pointer; }
        .hero { margin-bottom:18px; padding:24px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:var(--shadow); }
        .hero small { color:var(--blue); font-size:10px; font-weight:900; letter-spacing:.12em; }
        .hero h1 { margin:5px 0 5px; font-size:28px; letter-spacing:-.05em; }
        .hero p { margin:0; color:var(--muted); font-size:13px; line-height:1.55; }
        .stats { display:grid; grid-template-columns:repeat(4,1fr); margin-top:20px; border:1px solid var(--line); border-radius:13px; overflow:hidden; }
        .stat { padding:12px 14px; border-right:1px solid var(--line); background:#fafbfd; }
        .stat:last-child { border-right:0; }
        .stat span { display:block; color:#7b8492; font-size:10px; }
        .stat strong { display:block; margin-top:4px; font-size:18px; }
        .mode-section { padding:22px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:var(--shadow); }
        .section-title { margin-bottom:14px; }
        .section-title small { color:var(--blue); font-size:10px; font-weight:850; letter-spacing:.1em; }
        .section-title h2 { margin:4px 0 3px; font-size:18px; }
        .section-title p { margin:0; color:var(--muted); font-size:12px; }
        .mode-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .mode-card { display:flex; align-items:flex-start; gap:14px; min-height:112px; padding:18px; border:1px solid var(--line); border-radius:15px; background:#fff; color:inherit; text-align:left; cursor:pointer; transition:.16s; }
        .mode-card:hover { border-color:#9bbaf7; background:#f8fbff; transform:translateY(-1px); }
        .mode-icon { display:grid; place-items:center; width:42px; height:42px; flex:0 0 42px; border-radius:12px; background:#eff6ff; font-size:21px; }
        .mode-card strong { display:block; font-size:16px; }
        .mode-card span { display:block; margin-top:5px; color:var(--muted); font-size:11px; line-height:1.5; }
        .view { display:none; }
        .view.active { display:block; }
        .view-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .view-back { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#f8fafc; color:#475569; font-size:11px; font-weight:750; cursor:pointer; }
        .picker { width:100%; min-height:44px; padding:0 13px; border:1px solid #d7dee8; border-radius:11px; background:#fff; color:var(--text); font-size:13px; font-weight:700; outline:none; }
        .picker:focus { border-color:#7aa7f8; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
        .winner-search { margin-bottom:10px; }
        .directory { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; max-height:430px; overflow-y:auto; }
        .directory-btn { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px; border:1px solid var(--line); border-radius:11px; background:#fff; color:inherit; text-align:left; cursor:pointer; }
        .directory-btn strong { display:block; font-size:13px; }
        .directory-btn span { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
        .directory-btn em { color:var(--blue); font-size:11px; font-style:normal; font-weight:800; }
        .result { margin-top:16px; }
        .result-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:10px; padding:0 2px; }
        .result-head strong { font-size:18px; }
        .result-head span { color:var(--muted); font-size:11px; }
        .record-list { display:grid; gap:10px; }
        .record { padding:17px; border:1px solid var(--line); border-radius:15px; background:#fff; }
        .record-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .record-person strong { display:block; font-size:15px; }
        .record-person a { display:inline-block; margin-top:4px; color:#475569; font-size:12px; font-weight:650; text-decoration:none; }
        .badge { display:inline-flex; align-items:center; min-height:26px; padding:0 8px; border:1px solid #dce2ea; border-radius:999px; background:#f8fafc; color:#667085; font-size:9px; font-weight:850; }
        .badge.complete { border-color:#bbe6cb; background:#f0fdf4; color:var(--green); }
        .badge.partial { border-color:#fed7aa; background:#fff7ed; color:var(--orange); }
        .badge.mismatch { border-color:#fecaca; background:#fef2f2; color:var(--red); }
        .record-grid { display:grid; grid-template-columns:1.1fr 1fr 130px; gap:15px; margin-top:14px; padding-top:13px; border-top:1px solid #edf0f4; }
        .info-block span { display:block; color:#7a8493; font-size:9px; font-weight:700; }
        .info-block strong { display:block; margin-top:4px; color:#344054; font-size:11px; line-height:1.55; }
        .items { display:flex; flex-wrap:wrap; gap:5px; margin-top:11px; }
        .item-chip { padding:4px 7px; border-radius:7px; background:#f1f5f9; color:#475569; font-size:9px; font-weight:700; }
        .payment { margin-top:13px; padding:14px; border:1px solid #a7d9bc; border-radius:13px; background:linear-gradient(110deg,#f0fdf4,#fff); }
        .payment-title { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .payment-title strong { color:#166534; font-size:13px; }
        .payment-title b { color:#166534; font-size:17px; }
        .account { margin-top:8px; color:#253044; font-size:12px; font-weight:800; }
        .payment p { margin:6px 0 0; color:#587064; font-size:10px; line-height:1.55; }
        .payment-actions { display:flex; gap:7px; margin-top:11px; }
        .action { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 12px; border:0; border-radius:9px; background:#166534; color:#fff; font-size:11px; font-weight:800; text-decoration:none; cursor:pointer; }
        .action.secondary { border:1px solid #bbe6cb; background:#fff; color:#166534; }
        .empty { padding:34px 12px; color:#98a2b3; font-size:12px; text-align:center; }
        .loading { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(244,247,251,.86); color:#475569; font-size:13px; font-weight:800; backdrop-filter:blur(4px); }
        .toast { position:fixed; left:50%; bottom:22px; z-index:30; transform:translate(-50%,20px); padding:11px 15px; border-radius:10px; background:#172033; color:#fff; font-size:11px; font-weight:750; opacity:0; pointer-events:none; transition:.2s; }
        .toast.show { transform:translate(-50%,0); opacity:1; }
        @media (max-width:700px) {
            .app { padding:12px 12px 44px; }
            .topbar { margin-bottom:12px; }
            .hero,.mode-section { padding:17px; border-radius:16px; }
            .hero h1 { font-size:23px; }
            .stats { grid-template-columns:repeat(2,1fr); }
            .stat:nth-child(2) { border-right:0; }
            .stat:nth-child(-n+2) { border-bottom:1px solid var(--line); }
            .mode-grid,.directory { grid-template-columns:1fr; }
            .mode-card { min-height:94px; padding:15px; }
            .record-grid { grid-template-columns:1fr; gap:9px; }
            .info-block { padding-top:8px; border-top:1px dashed #e5e9f0; }
            .payment-actions { display:grid; grid-template-columns:1fr 1fr; }
            .action { width:100%; }
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="topbar"><a class="back" href="shipping.html">← 배송관리로 돌아가기</a><button class="refresh" type="button" onclick="reloadData(this)">새로고침</button></nav>
        <header class="hero">
            <small>INTERNAL SHIPPING CHECK</small>
            <h1>배송 등록 조회</h1>
            <p>업체 또는 낙찰자를 먼저 선택해 등록 내용과 합배송 정산을 교차 확인합니다.</p>
            <div class="stats" id="stats"></div>
        </header>

        <section class="mode-section view active" id="mode-home">
            <div class="section-title"><small>STEP 1</small><h2>조회 기준을 선택하세요</h2><p>선택 전에는 전체 내역을 펼치지 않습니다.</p></div>
            <div class="mode-grid">
                <button class="mode-card" type="button" onclick="openMode('company')"><span class="mode-icon">🏢</span><span><strong>업체 기준</strong><span>출품 업체를 선택하고 해당 업체의 모든 낙찰자·개체·배송 정보를 확인합니다.</span></span></button>
                <button class="mode-card" type="button" onclick="openMode('winner')"><span class="mode-icon">👤</span><span><strong>낙찰자 기준</strong><span>이름이나 연락처로 찾아 합배송 업체 구성과 배송비 입금 안내를 확인합니다.</span></span></button>
            </div>
        </section>

        <section class="mode-section view" id="mode-company">
            <div class="view-head"><div class="section-title"><small>COMPANY VIEW</small><h2>업체 기준 조회</h2><p>업체를 선택하면 관련 내역만 표시됩니다.</p></div><button class="view-back" type="button" onclick="openMode('home')">기준 다시 선택</button></div>
            <select class="picker" id="company-picker" onchange="renderCompany(this.value)"><option value="">업체를 선택하세요</option></select>
            <div class="result" id="company-result"><div class="empty">업체를 선택해 주세요.</div></div>
        </section>

        <section class="mode-section view" id="mode-winner">
            <div class="view-head"><div class="section-title"><small>WINNER VIEW</small><h2>낙찰자 기준 조회</h2><p>이름 또는 연락처로 빠르게 찾을 수 있습니다.</p></div><button class="view-back" type="button" onclick="openMode('home')">기준 다시 선택</button></div>
            <input class="picker winner-search" id="winner-search" type="search" placeholder="이름 또는 연락처 검색" oninput="renderWinnerDirectory(this.value)">
            <div class="directory" id="winner-directory"></div>
            <div class="result" id="winner-result"></div>
        </section>
    </main>
    <div class="loading" id="loading">배송 등록 데이터를 불러오는 중...</div>
    <div class="toast" id="toast"></div>
    <script>
        const WRAPANG_ACCOUNT = { bank:'국민은행', number:'645901-04-465911', holder:'이시안' };
        let soldItems = [];
        let winnerGroups = [];

        function esc(value) { return String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        function winnerIdentity(item) {
            const clean = String(item.winner || '').replace(/[\[\]]/g,'').trim();
            const match = clean.match(/01[0-9][\-.\s]?\d{3,4}[\-.\s]?\d{4}|(?<!\d)\d{8}(?!\d)/);
            const embedded = match ? match[0] : '';
            const source = embedded ? clean.replace(embedded,' ').replace(/\s+/g,' ').trim() : clean;
            const name = source.split('/').map(v=>v.trim()).filter(Boolean)[0] || '이름 없음';
            const phone = String(item.winner_phone || embedded).replace(/[^0-9]/g,'');
            return { key:phone ? 'phone:'+phone : 'name:'+name.toLowerCase(), name, phone };
        }
        function fmtPhone(value) {
            const p=String(value||'').replace(/[^0-9]/g,'');
            if(p.length===11) return p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7);
            if(p.length===10) return p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6);
            return p || '연락처 없음';
        }
        function fmtTime(value) {
            const d=new Date(value||0); if(Number.isNaN(d.getTime())||!value) return '-';
            return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        }
        function shippingSignature(item) { return [item.shipping_type||'',item.shipping_company||'',item.shipping_region||''].join('|'); }
        function parseRegion(raw) {
            const text=String(raw||'').trim();
            const memo=(text.match(/\[(?:메모|요청):\s*([^\]]*)\]/)||[])[1]||'';
            return { location:text.replace(/\s*\[(?:메모|요청):[^\]]*\]\s*$/,'').trim(), memo:memo.trim() };
        }
        function groupStatus(items) {
            const registered=items.filter(i=>i.shipping_type);
            const signatures=[...new Set(registered.map(shippingSignature))];
            if(!registered.length) return 'pending';
            if(registered.length<items.length) return 'partial';
            if(signatures.length>1) return 'mismatch';
            return 'complete';
        }
        function statusMeta(status) {
            return { complete:['등록 완료','complete'], pending:['미등록',''], partial:['부분 등록','partial'], mismatch:['입력 불일치','mismatch'] }[status];
        }
        function shippingInfo(group) {
            const registered=group.items.filter(i=>i.shipping_type).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0));
            const item=registered[0];
            if(!item) return { label:'수령 방법 미등록', detail:'-', company:'', memo:'' };
            if(item.shipping_type==='직접수령') return { label:'현장 직접 수령', detail:'배송비 없음', company:'', memo:parseRegion(item.shipping_region).memo };
            const parsed=parseRegion(item.shipping_region);
            return { label:(item.shipping_company||'배송')+' · '+(parsed.location||'상세 미입력'), detail:'배송비 '+group.shippingCost.toLocaleString()+'원', company:item.shipping_company||'', memo:parsed.memo };
        }
        function buildGroups() {
            const map={};
            soldItems.forEach(item=>{ const id=winnerIdentity(item); if(!map[id.key]) map[id.key]={...id,items:[]}; map[id.key].items.push(item); });
            winnerGroups=Object.values(map).map(group=>{
                const companies=[...new Set(group.items.map(i=>String(i.company||'').trim()).filter(Boolean))].sort();
                const latest=Math.max(0,...group.items.filter(i=>i.shipping_type).map(i=>new Date(i.updated_at||0).getTime()).filter(Number.isFinite));
                const shippingCost=group.items.reduce((sum,i)=>sum+(Number(i.shipping_cost)||0),0);
                const totalBid=group.items.reduce((sum,i)=>sum+(Number(i.sold_price||i.soldPrice)||0)*10000,0);
                return {...group,companies,status:groupStatus(group.items),latest,shippingCost,totalBid};
            }).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
        }
        function openMode(mode) {
            document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
            document.getElementById('mode-'+mode).classList.add('active');
            if(mode==='winner') renderWinnerDirectory('');
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function renderStats() {
            const complete=winnerGroups.filter(g=>g.status==='complete').length;
            const combined=winnerGroups.filter(g=>g.companies.length>1).length;
            const wrapang=winnerGroups.filter(g=>shippingInfo(g).company==='랩팡').length;
            document.getElementById('stats').innerHTML=[['낙찰자',winnerGroups.length+'명'],['등록 완료',complete+'명'],['합배송',combined+'명'],['랩팡 배송',wrapang+'명']].map(v=>'<div class="stat"><span>'+v[0]+'</span><strong>'+v[1]+'</strong></div>').join('');
        }
        function populateCompanies() {
            const list=[...new Set(soldItems.map(i=>String(i.company||'').trim()).filter(Boolean))].sort();
            document.getElementById('company-picker').innerHTML='<option value="">업체를 선택하세요</option>'+list.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
        }
        function itemChips(items) {
            return '<div class="items">'+items.map(i=>'<span class="item-chip">'+esc((i.company?'['+i.company+'] ':'')+(i.num?'No.'+i.num+' ':'')+(i.name||'이름 없음'))+'</span>').join('')+'</div>';
        }
        function smsText(group, ship) {
            return `[CDCUP 랩팡 합배송비 안내]\n${group.name}님, ${group.companies.length}개 업체 ${group.items.length}개체의 합배송비 안내입니다.\n\n■ 배송지: ${ship.label}\n■ 합배송비: ${group.shippingCost.toLocaleString()}원\n■ 입금계좌: ${WRAPANG_ACCOUNT.bank} ${WRAPANG_ACCOUNT.number}\n■ 예금주: ${WRAPANG_ACCOUNT.holder}\n\n업체별로 나누어 보내지 마시고, 합배송비 총액을 위 계좌로 1회만 입금해 주세요. 감사합니다.`;
        }
        function smsHref(group, ship) {
            const sep=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?';
            return 'sms:'+group.phone+sep+'body='+encodeURIComponent(smsText(group,ship));
        }
        function paymentHtml(group, ship) {
            if(ship.company!=='랩팡') return '';
            return '<div class="payment"><div class="payment-title"><strong>랩팡 합배송비 · 1회 입금</strong><b>'+group.shippingCost.toLocaleString()+'원</b></div><div class="account">'+WRAPANG_ACCOUNT.bank+' '+WRAPANG_ACCOUNT.number+' · '+WRAPANG_ACCOUNT.holder+'</div><p>업체별로 나누지 않고 합배송 전체 금액을 위 계좌로 한 번만 입금합니다.</p><div class="payment-actions">'+(group.phone?'<a class="action" href="'+smsHref(group,ship)+'">문자 보내기</a>':'')+'<button class="action secondary" type="button" onclick="copyPaymentMessage(\''+esc(group.key)+'\')">문구 복사</button></div></div>';
        }
        function recordHtml(group, scopedItems) {
            const meta=statusMeta(group.status), ship=shippingInfo(group), items=scopedItems||group.items;
            return '<article class="record"><div class="record-top"><div class="record-person"><strong>'+esc(group.name)+'</strong><a href="tel:'+esc(group.phone)+'">'+esc(fmtPhone(group.phone))+'</a></div><span class="badge '+meta[1]+'">'+meta[0]+'</span></div><div class="record-grid"><div class="info-block"><span>관련 업체</span><strong>'+esc(group.companies.join(', ')||'-')+' · '+group.items.length+'개체</strong></div><div class="info-block"><span>배송 정보</span><strong>'+esc(ship.label)+(ship.memo?'<br>요청: '+esc(ship.memo):'')+'</strong></div><div class="info-block"><span>최종 등록·수정</span><strong>'+esc(fmtTime(group.latest))+'</strong></div></div>'+itemChips(items)+paymentHtml(group,ship)+'</article>';
        }
        function renderCompany(company) {
            const box=document.getElementById('company-result');
            if(!company){box.innerHTML='<div class="empty">업체를 선택해 주세요.</div>';return;}
            const groups=winnerGroups.filter(g=>g.companies.includes(company));
            const scopedCount=soldItems.filter(i=>String(i.company||'').trim()===company).length;
            box.innerHTML='<div class="result-head"><strong>'+esc(company)+'</strong><span>'+groups.length+'명 · '+scopedCount+'개체</span></div><div class="record-list">'+groups.map(g=>recordHtml(g,g.items.filter(i=>String(i.company||'').trim()===company))).join('')+'</div>';
        }
        function renderWinnerDirectory(query) {
            const q=String(query||'').replace(/[^0-9가-힣a-zA-Z]/g,'').toLowerCase();
            const list=winnerGroups.filter(g=>!q||(g.name+g.phone).replace(/[^0-9가-힣a-zA-Z]/g,'').toLowerCase().includes(q));
            document.getElementById('winner-directory').innerHTML=list.length?list.map(g=>'<button class="directory-btn" type="button" onclick="renderWinner(\''+esc(g.key)+'\')"><span><strong>'+esc(g.name)+'</strong><span>'+esc(fmtPhone(g.phone))+' · '+esc(g.companies.join(', '))+'</span></span><em>'+g.items.length+'개체</em></button>').join(''):'<div class="empty">검색 결과가 없습니다.</div>';
        }
        function renderWinner(key) {
            const group=winnerGroups.find(g=>g.key===key), box=document.getElementById('winner-result');
            if(!group){box.innerHTML='';return;}
            document.getElementById('winner-search').style.display='none';
            document.getElementById('winner-directory').style.display='none';
            box.innerHTML='<div class="result-head"><div><strong>'+esc(group.name)+' 전체 내역</strong><span style="display:block;margin-top:3px">'+group.companies.length+'개 업체 · '+group.items.length+'개체</span></div><button class="view-back" type="button" onclick="resetWinnerSelection()">다른 낙찰자 선택</button></div><div class="record-list">'+recordHtml(group)+'</div>';
            box.scrollIntoView({behavior:'smooth',block:'start'});
        }
        function resetWinnerSelection() {
            const search=document.getElementById('winner-search');
            const directory=document.getElementById('winner-directory');
            search.style.display='block';
            directory.style.display='grid';
            search.value='';
            document.getElementById('winner-result').innerHTML='';
            renderWinnerDirectory('');
            search.focus();
            window.scrollTo({top:0,behavior:'smooth'});
        }
        async function copyPaymentMessage(key) {
            const group=winnerGroups.find(g=>g.key===key); if(!group) return;
            const text=smsText(group,shippingInfo(group));
            try { await navigator.clipboard.writeText(text); showToast('문자 안내 문구를 복사했습니다.'); }
            catch(e){ const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('문자 안내 문구를 복사했습니다.'); }
        }
        function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
        async function loadData() {
            document.getElementById('loading').style.display='grid';
            try { const items=await getItems(); soldItems=(items||[]).filter(i=>i.status&&i.status.includes('낙찰')); buildGroups(); renderStats(); populateCompanies(); renderWinnerDirectory(''); }
            catch(e){ console.error(e); document.getElementById('mode-home').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; }
            finally { document.getElementById('loading').style.display='none'; }
        }
        async function reloadData(button){const text=button.textContent;button.disabled=true;button.textContent='갱신 중...';await loadData();button.disabled=false;button.textContent=text;showToast('최신 등록 내역으로 갱신했습니다.');}
        loadData();
    </script>
</body>
</html>
