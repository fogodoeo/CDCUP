<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>경매 방송 허브</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1118;
            --panel: #151b25;
            --line: rgba(255,255,255,.1);
            --text: #f8fafc;
            --muted: #94a3b8;
            --blue: #2563eb;
            --gold: #d6b25e;
            --font: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 8%, rgba(37,99,235,.18), transparent 34%),
                radial-gradient(circle at 86% 12%, rgba(214,178,94,.16), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
        }
        main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            margin-bottom: 24px;
        }
        .kicker {
            color: var(--gold);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .18em;
        }
        h1 {
            margin: 8px 0 0;
            font-size: clamp(38px, 6vw, 76px);
            line-height: 1;
            letter-spacing: 0;
        }
        p {
            margin: 10px 0 0;
            max-width: 620px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .event-card {
            position: relative;
            overflow: hidden;
            min-height: 360px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            border: 1px solid var(--line);
            background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
            text-decoration: none;
            color: inherit;
        }
        .event-card::after {
            content: '';
            position: absolute;
            right: -70px;
            bottom: -90px;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
        }
        .event-card:hover { border-color: var(--accent); }
        .event-card.cdcup { --accent: var(--blue); }
        .event-card.crewart { --accent: var(--gold); }
        .mark {
            display: grid;
            place-items: center;
            width: 68px;
            height: 68px;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 25px;
            font-weight: 950;
        }
        .event-copy small {
            color: var(--accent);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .16em;
        }
        .event-copy h2 {
            margin: 9px 0 0;
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1;
        }
        .event-copy p { font-size: 13px; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }
        .chip {
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            padding: 0 11px;
            border: 1px solid rgba(255,255,255,.13);
            background: rgba(255,255,255,.035);
            color: var(--text);
            font-size: 12px;
            font-weight: 820;
        }
        .event-card .primary {
            border-color: var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .utility {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .utility a {
            color: var(--muted);
            border: 1px solid var(--line);
            padding: 9px 11px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
        }
        @media (max-width: 820px) {
            main { padding: 24px 0; }
            .top { display: block; }
            .grid { grid-template-columns: 1fr; }
            .event-card { min-height: 280px; }
        }
    </style>
</head>
<body>
    <main>
        <header class="top">
            <div>
                <div class="kicker">AUCTION BROADCAST CONSOLE</div>
                <h1>경매 방송 허브</h1>
                <p>이벤트별 관리 화면을 분리했습니다. CDCUP은 토너먼트 경매로, 크레와트는 기숙사 점수전으로 독립 운영합니다.</p>
            </div>
            <div class="utility">
                <a href="settings.html">공통 방송 설정</a>
                <a href="shipping.html">배송 관리</a>
            </div>
        </header>

        <section class="grid" aria-label="이벤트 선택">
            <a class="event-card cdcup" href="cdcup-index.html">
                <span class="mark">C</span>
                <div class="event-copy">
                    <small>TOURNAMENT AUCTION</small>
                    <h2>CDCUP</h2>
                    <p>개체 등록, 토너먼트 대진표, 경매 결과, 배송 흐름을 관리합니다.</p>
                    <div class="actions">
                        <span class="chip primary">관리 시작</span>
                        <span class="chip">대진표</span>
                        <span class="chip">순위표</span>
                    </div>
                </div>
            </a>

            <a class="event-card crewart" href="crewart-settings.html">
                <span class="mark">W</span>
                <div class="event-copy">
                    <small>HOUSE SCORE AUCTION</small>
                    <h2>크레와트</h2>
                    <p>밸런스 게임 설문, 기숙사 배정, 낙찰 점수판, 호그와트풍 송출 화면을 관리합니다.</p>
                    <div class="actions">
                        <span class="chip primary">설정 열기</span>
                        <span class="chip">설문</span>
                        <span class="chip">점수판</span>
                    </div>
                </div>
            </a>
        </section>
    </main>
</body>
</html>
