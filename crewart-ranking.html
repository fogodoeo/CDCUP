<!DOCTYPE html>

    <title>크레와트 점수표</title>
    <script src="supabase-bridge.js?v=20260717-egress-hotfix-v1"></script>
    <script src="event-modules.js?v=20260710-crebti3"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="crewart.css?v=20260707-magic2">
    <style>
        .cw-rank-table { width:100%; border-collapse:collapse; }
        .cw-rank-table th, .cw-rank-table td { padding:12px 10px; border-bottom:1px solid var(--cw-line); text-align:left; font-size:13px; }
        .cw-rank-table th { color:var(--cw-gold); font-size:11px; letter-spacing:.12em; }
        .cw-rank-table td.amount { text-align:right; font-variant-numeric:tabular-nums; font-weight:850; }
        .cw-btn.highlight { background: linear-gradient(135deg, #FFB300, #F59E0B); color: #111827; font-weight: 900; border: none; }
        .cw-btn.highlight:hover { background: linear-gradient(135deg, #F59E0B, #D97706); }
        .cw-btn.copied { background: #10B981 !important; color: #FFFFFF !important; }
        .cw-champ-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(255, 179, 0, 0.12), rgba(245, 158, 11, 0.04));
            border: 1.5px solid var(--cw-gold);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 14px;
        }
        .cw-champ-info { display: flex; align-items: center; gap: 14px; }
        .cw-champ-trophy { font-size: 32px; }
        .cw-champ-title { font-size: 11px; font-weight: 800; color: var(--cw-gold); letter-spacing: .1em; text-transform: uppercase; }
        .cw-champ-name { font-size: 20px; font-weight: 900; color: var(--cw-cream, #FFFFFF); margin-top: 2px; }
        .cw-champ-stats { font-size: 13px; color: #9CA3AF; margin-top: 2px; }
        .cw-champ-stats strong { color: var(--cw-gold); }
    </style>
</head>
<body class="crewart-page">
    <nav class="cw-nav">
        <a class="cw-brand" href="crewart-ranking.html"><span class="cw-brand-mark">W</span><span>크레와트</span></a>
        <div class="cw-nav-links">
            <a href="index.html">허브</a>
            <a href="crewart-settings.html">기숙사 설정</a>
            <a href="crewart-survey.html">설문</a>
            <a class="active" href="crewart-ranking.html">점수표</a>
            <a href="cdcup/">CDCUP</a>
        </div>
    </nav>

    <main class="cw-shell">
        <header class="cw-page-head">
            <div>
                <div class="cw-kicker">CREWART HOUSE STANDINGS</div>
                <h1>기숙사 점수표</h1>
                <p>설문 배정표와 낙찰 내역을 기준으로 자동 집계합니다.</p>
            </div>
            <div class="cw-actions">
                <button class="cw-btn highlight" id="btn-copy-champion" type="button" onclick="copyChampionOnly()">🏆 우승팀 복사</button>
                <button class="cw-btn" id="btn-copy-notice" type="button" onclick="copyChampionNotice()">📢 우승 공지 복사</button>
                <button class="cw-btn" id="btn-copy-ranking" type="button" onclick="copyAllRanking()">📋 전체 순위 복사</button>
                <button class="cw-btn" type="button" onclick="loadRanking()">새로고침</button>
                <a class="cw-btn primary" href="broadcast-router.html?event=crewart&amp;page=3" target="_blank" rel="noopener">크레와트 3P 송출</a>
            </div>
        </header>

        <section id="champ-banner-wrap" class="cw-champ-banner" style="display:none;">
            <div class="cw-champ-info">
                <div class="cw-champ-trophy">🏆</div>
                <div>
                    <div class="cw-champ-title">CURRENT LEADING CHAMPION</div>
                    <div class="cw-champ-name" id="champ-name-display">비전형 (야망의-탑)</div>
                    <div class="cw-champ-stats" id="champ-stats-display">142점 · 5건 낙찰 · 142만원</div>
                </div>
            </div>
            <button class="cw-btn highlight" type="button" onclick="copyChampionOnly()" style="font-size:14px;padding:10px 18px;">
                📋 우승팀명 복사
            </button>
        </section>

        <section id="scoreboard-wrap" style="min-height:520px;border:1px solid var(--cw-line);overflow:hidden;"></section>

        <section class="cw-grid" style="margin-top:14px;">
            <article class="cw-panel">
                <h2>기숙사별 집계</h2>
                <div id="house-table"></div>
            </article>
            <article class="cw-panel">
                <h2>미배정 낙찰</h2>
                <div id="unassigned-list" class="cw-note">확인 중...</div>
            </article>
        </section>
    </main>

    <script>
        let currentHouses = [];

        function money(value) {
            return Number(value || 0).toLocaleString('ko-KR');
        }

        async function copyToClipboard(text, btnElement, successMsg = '✅ 복사됨!') {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                if (btnElement) {
                    const originalText = btnElement.innerText;
                    btnElement.innerText = successMsg;
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.innerText = originalText;
                        btnElement.classList.remove('copied');
                    }, 2000);
                }
            } catch (err) {
                alert('복사 실패: ' + err);
            }
        }

        function copyChampionOnly() {
            if (!currentHouses || !currentHouses[0]) return;
            const champ = currentHouses[0];
            const text = `${champ.name}`;
            const btn = document.getElementById('btn-copy-champion');
            copyToClipboard(text, btn, `✅ '${text}' 복사 완료!`);
        }

        function copyChampionNotice() {
            if (!currentHouses || !currentHouses[0]) return;
            const champ = currentHouses[0];
            const text = `🏆 [크레와트 기숙사 대항전 최종 우승] 🏆\n👑 우승 기숙사: ${champ.name}\n📊 최종 성적: ${Math.round(champ.points)}점 (${champ.soldCount}건 낙찰 · 총 ${money(champ.amount)}만원)\n🎉 축하합니다! ${champ.name} 소속 회원분들께 우승 혜택이 적용됩니다!`;
            const btn = document.getElementById('btn-copy-notice');
            copyToClipboard(text, btn, '✅ 우승 공지 복사 완료!');
        }

        function copyAllRanking() {
            if (!currentHouses || !currentHouses.length) return;
            const lines = ['🏆 [크레와트 기숙사 최종 순위표] 🏆'];
            const medals = ['🥇 1위', '🥈 2위', '🥉 3위', '4위'];
            currentHouses.forEach((h, idx) => {
                const medal = medals[idx] || `${idx + 1}위`;
                lines.push(`${medal}: ${h.name} (${Math.round(h.points)}점 · ${h.soldCount}건 · ${money(h.amount)}만원)`);
            });
            const text = lines.join('\n');
            const btn = document.getElementById('btn-copy-ranking');
            copyToClipboard(text, btn, '✅ 전체 순위 복사 완료!');
        }

        async function loadRanking() {
            const [cfg, items] = await Promise.all([
                getRuntimeConfigMap(false),
                getBroadcastItemsCached(false, 60000)
            ]);
            const config = { ...(cfg || {}), active_event_module: 'crewart' };
            applyAuctionEventModule(config);
            document.getElementById('scoreboard-wrap').innerHTML = renderCrewartHouseBoardHTML(items || [], config);
            const result = buildCrewartHouseScores(items || [], config);
            currentHouses = result.houses || [];

            if (currentHouses.length > 0) {
                const champ = currentHouses[0];
                document.getElementById('champ-banner-wrap').style.display = 'flex';
                document.getElementById('champ-name-display').innerText = `${champ.name}`;
                document.getElementById('champ-name-display').style.color = champ.accent || '#F59E0B';
                document.getElementById('champ-stats-display').innerHTML = `<strong>${Math.round(champ.points)}점</strong> · ${champ.soldCount}건 낙찰 · 총 <strong>${money(champ.amount)}만원</strong>`;
            }

            document.getElementById('house-table').innerHTML = `<table class="cw-rank-table">
                <thead><tr><th>RANK</th><th>기숙사</th><th class="amount">점수</th><th class="amount">낙찰</th><th class="amount">낙찰금</th></tr></thead>
                <tbody>${result.houses.map(row => `<tr>
                    <td>${String(row.rank).padStart(2, '0')}</td>
                    <td style="color:${row.accent};font-weight:900;">${row.name}</td>
                    <td class="amount">${money(Math.round(row.points))}점</td>
                    <td class="amount">${row.soldCount}건</td>
                    <td class="amount">${money(row.amount)}만원</td>
                </tr>`).join('')}</tbody>
            </table>`;
            document.getElementById('unassigned-list').innerHTML = result.unassigned.length
                ? result.unassigned.map(entry => `<div style="padding:8px 0;border-bottom:1px solid var(--cw-line);">${entry.item.winner || '낙찰자 미기록'} · ${entry.item.name || ''} · ${money(entry.amount)}만원</div>`).join('')
                : '미배정 낙찰이 없습니다.';
        }

        loadRanking();
        setInterval(loadRanking, 10000);
    </script>
</body>
</html>
