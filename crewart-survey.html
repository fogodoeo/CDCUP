<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>크레와트 설문</title>
    <script src="supabase-bridge.js?v=20260703-flex-auction"></script>
    <script src="event-modules.js?v=20260707-nav3"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="crewart.css?v=20260708-survey2">
</head>
<body class="crewart-page">
    <nav class="cw-nav">
        <a class="cw-brand" href="crewart-survey.html"><span class="cw-brand-mark">W</span><span>크레와트</span></a>
        <div class="cw-nav-links">
            <a href="index.html">허브</a>
            <a href="crewart-settings.html">기숙사 설정</a>
            <a class="active" href="crewart-survey.html">설문</a>
            <a href="crewart-ranking.html">점수표</a>
            <a href="cdcup/">CDCUP</a>
        </div>
    </nav>

    <main class="cw-shell" style="max-width:920px;">
        <header class="cw-page-head">
            <div>
                <div class="cw-kicker">SORTING BALANCE GAME</div>
                <h1>기숙사 배정 설문</h1>
                <p>답변을 고르면 크레와트 기숙사가 자동 배정됩니다.</p>
            </div>
        </header>

        <section class="cw-panel" id="intro-panel">
            <h2>입찰자 정보</h2>
            <div class="cw-grid">
                <div class="cw-field">
                    <label for="nickname">낙찰/채팅 닉네임</label>
                    <input class="cw-input" id="nickname" autocomplete="nickname" placeholder="예: 크레마법사">
                </div>
                <div class="cw-field">
                    <label for="aliases">별칭</label>
                    <input class="cw-input" id="aliases" placeholder="예: 밴드닉/오픈채팅닉">
                </div>
            </div>
            <button class="cw-btn primary" type="button" onclick="startSurvey()">시작</button>
        </section>

        <section id="question-area" style="display:none;">
            <div class="cw-note" id="progress" style="margin-bottom:10px;"></div>
            <div id="questions"></div>
            <div class="cw-actions" style="justify-content:space-between;margin-top:14px;">
                <button class="cw-btn" type="button" onclick="prevQuestion()">이전</button>
                <button class="cw-btn primary" type="button" onclick="nextQuestion()">다음</button>
            </div>
        </section>

        <section class="cw-panel" id="result-panel" style="display:none;text-align:center;">
            <div class="cw-kicker">SORTING COMPLETE</div>
            <h1 id="result-house" style="margin:10px 0 6px;font-size:clamp(40px,7vw,88px);"></h1>
            <p id="result-copy" style="color:var(--cw-muted);font-weight:800;"></p>
            <div class="cw-result-breakdown" id="result-breakdown"></div>
            <div class="cw-trait-breakdown" id="trait-breakdown"></div>
            <div class="cw-actions" style="justify-content:center;margin-top:20px;">
                <a class="cw-btn" href="crewart-ranking.html">점수표 보기</a>
                <button class="cw-btn primary" type="button" onclick="submitSurvey()">배정 저장</button>
            </div>
        </section>
    </main>

    <div class="cw-toast" id="toast"></div>

    <script>
        let config = {};
        let houses = [];
        let current = 0;
        let answers = [];
        let finalHouse = null;
        let finalScores = [];
        let finalTraitScores = {};
        let isLoaded = false;

        const HOUSE_PROFILES = [
            { title: '루멘크라운형', copy: '희소성, 임팩트, 눈에 들어오는 퀄리티에 가장 빠르게 반응하는 타입입니다.' },
            { title: '세이블퀼형', copy: '형질, 라인, 영양과 근거를 차분하게 비교하는 타입입니다.' },
            { title: '모스그로브형', copy: '사육 안정감, 경험, 개체와의 관계를 중시하는 타입입니다.' },
            { title: '오닉스테일형', copy: '모프, 규모, 번식 가능성과 큰 그림에 끌리는 타입입니다.' }
        ];

        const TRAITS = [
            { id: 'impact', label: '미감/임팩트' },
            { id: 'analysis', label: '형질/분석' },
            { id: 'care', label: '케어/실용' },
            { id: 'breeding', label: '브리딩/해칭' },
            { id: 'collection', label: '수집/확장' },
            { id: 'bond', label: '교감/경험' }
        ];

        const HOUSE_TRAIT_WEIGHTS = [
            { impact: 2, collection: 1, bond: 0.5 },
            { analysis: 2, breeding: 1, care: 0.5 },
            { care: 2, bond: 1.5, analysis: 0.5 },
            { collection: 2, breeding: 1.5, impact: 0.5 }
        ];

        const QUESTIONS = [
            { q: 'Q1. 당신은 둘 중 어떤 화이트가 더 좋나요?', a: ['화이트 양은 적지만, 퓨어화이트', '화이트 양은 많지만, 아이보리 또는 노란색'], traits: [{ impact: 2, analysis: 1 }, { collection: 2, impact: 1 }] },
            { q: 'Q2. 비슷하지만 좀 더 끌리는 모프는?', a: ['세이블 릴리', '프라푸치노'], traits: [{ collection: 2, impact: 1 }, { analysis: 2, breeding: 1 }] },
            { q: 'Q3. 두가지 타입 중 하나를 고른다면?', a: ['쿼드 타입', '익할(익스트림 할리퀸) 타입'], traits: [{ care: 2, analysis: 1 }, { impact: 2, collection: 1 }] },
            { q: 'Q4. 둘 중 더 선호하는 먹이급여 방식은?', a: ['슈퍼푸드 단일', '슈퍼푸드 & 충식 병행'], traits: [{ care: 2, analysis: 1 }, { care: 2, breeding: 1 }] },
            { q: 'Q5. 내가 좋아하는 사육장은?', a: ['아크릴사육장 또는 유리장', '적재형 케이지'], traits: [{ care: 2, bond: 1 }, { collection: 2, care: 1 }] },
            { q: 'Q6. 내가 조금 더 선호하는 유명 라인은?', a: ['보바', 'SPT'], traits: [{ collection: 2, impact: 1 }, { analysis: 2, breeding: 1 }] },
            { q: 'Q7. 장단점이 뚜렷한 크레 두마리가 있습니다.\n어느아이로 선택하시겠습니까?', a: ['옆구리(레터럴)이 아쉽지만, 크라운이 매우 좋음', '크라운이 없지만, 옆구리(레터럴)이 매우 좋음'], traits: [{ impact: 2, collection: 1 }, { analysis: 2, impact: 1 }] },
            { q: 'Q8. 평소 입양할때 조금 더 선호하는 방식은?', a: ['오프라인 (행사, 샵 등)', '온라인 (피들, 파사모 등)'], traits: [{ bond: 2, care: 1 }, { collection: 2, analysis: 1 }] },
            { q: 'Q9. 두 가지 형질 중 하나를 골라야한다면?', a: ['색감은 매우좋지만, 형질이 아쉬운', '형질이 매우 좋지만, 색감이 아쉬운'], traits: [{ impact: 2, bond: 1 }, { analysis: 2, breeding: 1 }] },
            { q: 'Q10. 내가 처음 해칭한 크레는?', a: ['모프(릴리, 카푸, 세이블, 아잔틱 등)', '노멀 (트라이, 챠콜, 달마 등)'], traits: [{ breeding: 2, collection: 1 }, { bond: 2, care: 1 }] },
            { q: 'Q11. 내가 선호하는 슈퍼푸드는?', a: ['기호도는 낮으나, 영양성분이 좋은 슈퍼푸드', '영양성분이 낮으나, 기호도가 좋은 슈퍼푸드'], traits: [{ analysis: 2, care: 1 }, { care: 2, bond: 1 }] },
            { q: 'Q12. 메인숫을 한마리만 입양할 수 있습니다.\n두마리중 어느아이로 고르시겠습니까?', a: ['일년에 한번 메이팅하는 초 하이엔드 수컷', '매일 메이팅하는 나의 돌쇠 수컷 (퀄리티 보장 못함)'], traits: [{ impact: 2, collection: 1 }, { breeding: 2, care: 1 }] },
            { q: 'Q13. 두 가지 상황 중 하나를 골라야합니다.\n누구와 함께하시겠습니까?', a: ['파충류샵 데이트 가자 하는 “카리나” 또는 “차은우”', '같이 크레 입양하러 가자 하는 “이재용”'], traits: [{ bond: 2, impact: 1 }, { collection: 2, analysis: 1 }] },
            { q: 'Q14. 로또에 당첨됐습니다! 어떻게 사용하시겠습니까?', a: ['1000만원 퀄리티 10마리 입양', '100만원 퀄리티 100마리 입양'], traits: [{ impact: 2, analysis: 1 }, { collection: 2, breeding: 1 }] },
            { q: 'Q15. 마지막 문항입니다. 당신이 크레를 키우며,\n가장 설레였던 순간은 둘중 언제였나요?', a: ['처음 입양했던 기억', '처음 해칭했던 순간'], traits: [{ bond: 2, care: 1 }, { breeding: 2, bond: 1 }] }
        ];

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function formatText(value) {
            return escapeHtml(value).replace(/\n/g, '<br>');
        }

        function toast(message, isError) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.style.borderColor = isError ? '#fca5a5' : 'var(--cw-gold)';
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2400);
        }

        function normalizeName(value) {
            return String(value || '').toLowerCase().replace(/\([^)]*\)/g, '').replace(/[^0-9a-z가-힣ㄱ-ㅎㅏ-ㅣ]/gi, '');
        }

        function startSurvey() {
            const nickname = document.getElementById('nickname').value.trim();
            if (!nickname) { toast('닉네임을 입력해주세요.', true); return; }
            if (!isLoaded || !houses.length) { toast('기숙사 설정을 불러오는 중입니다. 잠시 후 다시 시작해주세요.', true); return; }
            document.getElementById('intro-panel').style.display = 'none';
            document.getElementById('question-area').style.display = '';
            renderQuestions();
        }

        function renderQuestions() {
            const wrap = document.getElementById('questions');
            wrap.innerHTML = QUESTIONS.map((question, index) => `
                <article class="cw-question ${index === current ? 'active' : ''}">
                    <h2>${formatText(question.q)}</h2>
                    <div class="cw-choice-grid">
                        ${question.a.map((label, choiceIndex) => `<button type="button" class="cw-choice ${answers[index] === choiceIndex ? 'selected' : ''}" onclick="chooseAnswer(${index}, ${choiceIndex})">${formatText(label)}</button>`).join('')}
                    </div>
                </article>
            `).join('');
            document.getElementById('progress').textContent = `${current + 1} / ${QUESTIONS.length}`;
        }

        function chooseAnswer(index, choiceIndex) {
            answers[index] = choiceIndex;
            renderQuestions();
        }

        function prevQuestion() {
            current = Math.max(0, current - 1);
            renderQuestions();
        }

        function nextQuestion() {
            if (answers[current] === undefined) { toast('선택지를 골라주세요.', true); return; }
            if (current < QUESTIONS.length - 1) {
                current += 1;
                renderQuestions();
                return;
            }
            finishSurvey();
        }

        function scoreAnswers() {
            const traitScores = TRAITS.reduce((acc, trait) => {
                acc[trait.id] = 0;
                return acc;
            }, {});
            answers.forEach((choice, index) => {
                const traits = QUESTIONS[index].traits && QUESTIONS[index].traits[choice] ? QUESTIONS[index].traits[choice] : {};
                Object.entries(traits).forEach(([traitId, value]) => {
                    traitScores[traitId] = (traitScores[traitId] || 0) + (Number(value) || 0);
                });
            });
            const houseScores = houses.map((_, index) => {
                const weights = HOUSE_TRAIT_WEIGHTS[index % HOUSE_TRAIT_WEIGHTS.length] || {};
                return Object.entries(weights).reduce((sum, [traitId, weight]) => {
                    return sum + ((traitScores[traitId] || 0) * (Number(weight) || 0));
                }, 0);
            });
            return { traitScores, houseScores };
        }

        function houseProfile(index) {
            return HOUSE_PROFILES[index % HOUSE_PROFILES.length] || HOUSE_PROFILES[0];
        }

        function renderScoreBreakdown(scores, bestIndex) {
            const wrap = document.getElementById('result-breakdown');
            wrap.innerHTML = houses.map((house, index) => `
                <div class="cw-score-pill ${index === bestIndex ? 'active' : ''}" style="--house:${escapeHtml(house.color || '#e0b85a')};--house-accent:${escapeHtml(house.accent || house.color || '#e0b85a')};">
                    <span>${escapeHtml(house.name)}</span>
                    <strong>${Math.round(scores[index] || 0)}점</strong>
                </div>
            `).join('');
        }

        function renderTraitBreakdown(traitScores) {
            const wrap = document.getElementById('trait-breakdown');
            wrap.innerHTML = TRAITS
                .map(trait => ({ ...trait, score: traitScores[trait.id] || 0 }))
                .sort((a, b) => b.score - a.score || a.label.localeCompare(b.label, 'ko'))
                .map(trait => `
                    <div class="cw-trait-pill">
                        <span>${escapeHtml(trait.label)}</span>
                        <strong>${Math.round(trait.score)}점</strong>
                    </div>
                `).join('');
        }

        function finishSurvey() {
            const missing = QUESTIONS.findIndex((_, index) => answers[index] === undefined);
            if (missing >= 0) {
                current = missing;
                renderQuestions();
                toast('선택하지 않은 문항이 있습니다.', true);
                return;
            }
            const scored = scoreAnswers();
            finalScores = scored.houseScores;
            finalTraitScores = scored.traitScores;
            const tieSeed = answers.reduce((sum, choice, index) => sum + ((choice + 1) * (index + 1)), 0) % Math.max(1, houses.length);
            const best = finalScores.map((score, index) => ({ score, index }))
                .sort((a, b) => b.score - a.score || Math.abs(a.index - tieSeed) - Math.abs(b.index - tieSeed) || a.index - b.index)[0];
            finalHouse = houses[best.index] || houses[0];
            const profile = houseProfile(best.index);
            document.getElementById('question-area').style.display = 'none';
            document.getElementById('result-panel').style.display = '';
            document.getElementById('result-house').textContent = finalHouse.name;
            document.getElementById('result-house').style.color = finalHouse.accent || finalHouse.color || 'var(--cw-gold)';
            document.getElementById('result-copy').textContent = `${profile.title} · ${profile.copy} 낙찰 시 이 기숙사 점수로 자동 반영됩니다.`;
            renderScoreBreakdown(finalScores, best.index);
            renderTraitBreakdown(finalTraitScores);
        }

        function participantLine(name, house, aliases) {
            return [name, house.name, aliases].filter(Boolean).join(',');
        }

        function upsertParticipantLine(existing, name, line) {
            const key = normalizeName(name);
            const lines = String(existing || '').split(/\r?\n/).filter(Boolean);
            const filtered = lines.filter(row => normalizeName(row.split(/[,\t|]/)[0]) !== key);
            filtered.push(line);
            return filtered.join('\n');
        }

        async function submitSurvey() {
            if (!finalHouse) return;
            const name = document.getElementById('nickname').value.trim();
            const aliases = document.getElementById('aliases').value.trim();
            try {
                const nextParticipants = upsertParticipantLine(
                    config.crewart_participants || '',
                    name,
                    participantLine(name, finalHouse, aliases)
                );
                const responses = JSON.parse(config.crewart_survey_responses || '[]');
                responses.push({
                    name,
                    aliases,
                    house: finalHouse.name,
                    houseId: finalHouse.id,
                    profile: houseProfile(houses.findIndex(house => house.id === finalHouse.id)).title,
                    answers: answers.slice(),
                    answerLabels: answers.map((choice, index) => ({
                        question: QUESTIONS[index].q,
                        choice: choice + 1,
                        label: QUESTIONS[index].a[choice]
                    })),
                    scores: houses.map((house, index) => ({
                        house: house.name,
                        score: finalScores[index] || 0
                    })),
                    traitScores: TRAITS.map(trait => ({
                        trait: trait.label,
                        traitId: trait.id,
                        score: finalTraitScores[trait.id] || 0
                    })),
                    questionVersion: 'crewart-20260708-v2',
                    createdAt: new Date().toISOString()
                });
                await updateConfigs({
                    active_event_module: 'crewart',
                    crewart_participants: nextParticipants,
                    crewart_survey_responses: JSON.stringify(responses.slice(-500))
                });
                toast('기숙사 배정을 저장했습니다.');
            } catch (error) {
                toast('저장 실패: ' + error.message, true);
            }
        }

        async function load() {
            try {
                config = await getConfigMap() || {};
                applyAuctionEventModule({ ...config, active_event_module: 'crewart' });
                houses = parseCrewartHouses(config.crewart_houses);
            } catch (error) {
                toast('기숙사 설정을 불러오지 못했습니다: ' + error.message, true);
            } finally {
                isLoaded = true;
            }
        }

        load();
    </script>
</body>
</html>
